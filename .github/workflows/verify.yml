name: verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline verifier, 3 isolated modes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run root regression suite and verifier in 3 isolated modes
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -I -B -W error test_verify_all_standalone.py
          python3 -I -O -B -W error test_verify_all_standalone.py
          python3 -I -B test_verify_all_standalone.py
          python3 -I -B verify_all_standalone.py > /tmp/verify-mode1.txt
          python3 -I -O -B verify_all_standalone.py > /tmp/verify-mode2.txt
          python3 -I -B -W error verify_all_standalone.py > /tmp/verify-mode3.txt
          sha256sum /tmp/verify-mode1.txt /tmp/verify-mode2.txt /tmp/verify-mode3.txt
          test "$(sha256sum < /tmp/verify-mode1.txt)" = "$(sha256sum < /tmp/verify-mode2.txt)"
          test "$(sha256sum < /tmp/verify-mode1.txt)" = "$(sha256sum < /tmp/verify-mode3.txt)"
          cat /tmp/verify-mode1.txt
