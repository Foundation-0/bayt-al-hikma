name: verify-socratic-seminar

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-seminar:
    name: Socratic Seminar unified verifier & R5 suites (3 isolated modes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run verify_all_seminar.py in 3 isolated modes and compare stdout hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B socratic-operator-seminar/verify_all_seminar.py --json > /tmp/seminar-mode1.json
          python3 -I -O -B socratic-operator-seminar/verify_all_seminar.py --json > /tmp/seminar-mode2.json
          python3 -I -B -W error socratic-operator-seminar/verify_all_seminar.py --json > /tmp/seminar-mode3.json
          sha256sum /tmp/seminar-mode1.json /tmp/seminar-mode2.json /tmp/seminar-mode3.json
          test "$(sha256sum < /tmp/seminar-mode1.json)" = "$(sha256sum < /tmp/seminar-mode2.json)"
          test "$(sha256sum < /tmp/seminar-mode1.json)" = "$(sha256sum < /tmp/seminar-mode3.json)"
          cmp -s /tmp/seminar-mode1.json socratic-operator-seminar/certificates/seminar_unified_certificate.json

      - name: Run all 5 seminar R5 suites and root verifier regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -O -B -W error socratic-operator-seminar/tests/test_socratic_operator_seminar_r5.py
          python3 -I -O -B -W error socratic-operator-seminar/tests/test_pilot1_theorems_r5.py
          python3 -I -O -B -W error socratic-operator-seminar/tests/test_ablation_scorecard_r5.py
          python3 -I -O -B -W error socratic-operator-seminar/lean_pilot1_theorems/test_verify_s150_lean_theorems_r5.py
          python3 -I -O -B -W error socratic-operator-seminar/tests/test_verify_all_seminar_r5.py
          python3 -I -O -B -W error test_verify_all_standalone.py
